name: Build macOS Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    # Compiles your application layout directly into a native Apple Installer package (.dmg)
    - name: Compile macOS DMG Installer
      run: npx electron-builder build --mac dmg --publish never

    # 📁 Pulls only the generated .dmg installer and bundles it into a secure, clean ZIP container
    - name: Archive DMG Installer into ZIP
      run: |
        mkdir -p Output
        mv dist/*.dmg Output/
        cd Output
        zip -r Matix-The-Math-Club-Mac.zip *.dmg

    - name: Upload Clean Mac Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Mac-Release
        path: Output/*.zip
