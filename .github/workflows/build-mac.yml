name: Build macOS Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    # 🚀 FIX: Compiles your native Apple Disk Image installer (.dmg)
    - name: Compile macOS DMG Installer
      run: npx electron-builder build --mac dmg --publish never

    # 📁 FIX: Uploads the raw .dmg file directly without manual zipping blocks
    - name: Upload Clean Mac Installer Binary
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Mac-Installer
        path: dist/*.dmg
