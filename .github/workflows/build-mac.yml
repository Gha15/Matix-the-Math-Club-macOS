name: Build macOS Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    # 🚀 FIX: Runs electron-builder to compile your native Mac App and Disk Image (.dmg)
    - name: Compile macOS Installer
      run: npm run build

    - name: Archive Production Build into ZIP
      run: |
        mkdir -p Output
        ditto -c -k --sequesterRsrc --keepParent dist/*.dmg Output/Matix-The-Math-Club-Mac.zip

    - name: Upload Public Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Mac-Release
        path: Output/*.zip
