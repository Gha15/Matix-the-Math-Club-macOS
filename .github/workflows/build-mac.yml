name: Build Mac App

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Sync app payload
        run: node sync-app.js

      - name: Check Apple Credentials Status
        id: apple
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and notarise for Apple Silicon (Compressed)
        if: steps.apple.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Replaced --universal with --arm64 to slice the file size in half
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Verify Signature and Notarisation
        if: steps.apple.outputs.signed == 'true'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -n 1)
          echo "Checking application package at $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP" || echo "Stapler pending: Notarisation processing asynchronously."
          spctl --assess --type execute --verbose "$APP"

      - name: Build unsigned Mac app fallback
        if: steps.apple.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          echo "Built without an Apple signature. Users follow manual bypass steps."

      - uses: actions/upload-artifact@v4
        with:
          name: matix-mac
          path: dist/*.dmg
          if-no-files-found: error
